# ==========================================
# TERMINAL
# ==========================================
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

# ==========================================
# PREFIX
# ==========================================
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ==========================================
# CORE BEHAVIOR
# ==========================================
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 1000000
set -g set-clipboard on
set -g status-position top
set -g focus-events on
setw -g mode-keys vi
setw -g monitor-activity on
set -g visual-activity off

# ==========================================
# MOUSE
# ==========================================
set -g mouse on

# ==========================================
# KEYBINDINGS
# ==========================================
bind r source-file ~/.tmux.conf \; display-message "Reloaded!"

# Splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window management
bind c new-window -c "#{pane_current_path}"
bind -r n next-window
bind -r p previous-window
bind -r > swap-window -d -t +1
bind -r < swap-window -d -t -1
bind X kill-window

# ==========================================
# COPY MODE
# ==========================================
bind Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi H   send -X start-of-line
bind -T copy-mode-vi L   send -X end-of-line
bind -T copy-mode-vi Escape send -X cancel

# ==========================================
# POPUPS
# ==========================================
bind g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"
bind t display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "btm"
bind e display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s scratch"

# ==========================================
# PLUGINS
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'dracula/tmux'

# Yank
set -g @yank_action 'copy-pipe-and-cancel'

# Resurrect & Continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# FZF URL
set -g @fzf-url-bind 'u'

# Dracula
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session
set -g @dracula-plugins "cpu-usage ram-usage git time"
set -g @dracula-show-empty-plugins false
set -g @dracula-git-show-current-symbol ✓
set -g @dracula-git-no-repo-message "no git"

set -g status-interval 5

run '~/.tmux/plugins/tpm/tpm'
